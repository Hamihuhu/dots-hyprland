# sync-extra.conf — extra sync mappings for conjure and siphon
#
# Format:
#   <source_path> -> <dest_path>
#
# Rules:
#   - Paths support ~ and shell variables (e.g. $XDG_CONFIG_HOME)
#   - Lines starting with # are comments; blank lines are ignored
#   - --delete is active: files removed on one side will be removed on the other
#   - conjure reads this as: source -> dest  (repo/external -> live)
#   - siphon  reads this as: dest   -> source (live -> repo/external)
#
# Open this file with: ./grimoire
#
# Examples:
#   ~/my-nvim-config -> ~/.config/nvim
#   $XDG_CONFIG_HOME/my-other-config -> ~/projects/my-dotfiles/my-other-config
