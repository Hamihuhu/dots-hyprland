# dotsync.conf — dotfile sync mappings
#
# Format:
#   [section]                        section name (used for selective sync)
#   repo_path -> live_path           sync a file or directory
#   repo_path -> live_path !subdir   sync a directory, excluding subdir
#
# Notes:
#   - repo_path: relative to dotsync root, or absolute/~ for external paths
#   - live_path: supports ~ and $VARIABLES
#   - apply: left -> right    (repo -> live)
#   - capture: right -> left  (live -> repo)
#   - --delete is active: removals on one side propagate to the other
#
# Open this file with: ./dotsync edit
#
# ─────────────────────────────────────────────────────────────────────────────

[misc]
dots/.config/foot                              -> ~/.config/foot
dots/.config/fuzzel                            -> ~/.config/fuzzel
dots/.config/kde-material-you-colors           -> ~/.config/kde-material-you-colors
dots/.config/kitty                             -> ~/.config/kitty
dots/.config/Kvantum                           -> ~/.config/Kvantum
dots/.config/matugen                           -> ~/.config/matugen
dots/.config/mpv                               -> ~/.config/mpv
dots/.config/wlogout                           -> ~/.config/wlogout
dots/.config/xdg-desktop-portal               -> ~/.config/xdg-desktop-portal
dots/.config/zshrc.d                           -> ~/.config/zshrc.d
dots/.config/chrome-flags.conf                 -> ~/.config/chrome-flags.conf
dots/.config/code-flags.conf                   -> ~/.config/code-flags.conf
dots/.config/darklyrc                          -> ~/.config/darklyrc
dots/.config/dolphinrc                         -> ~/.config/dolphinrc
dots/.config/kdeglobals                        -> ~/.config/kdeglobals
dots/.config/konsolerc                         -> ~/.config/konsolerc
dots/.config/starship.toml                     -> ~/.config/starship.toml
dots/.config/thorium-flags.conf                -> ~/.config/thorium-flags.conf

[konsole]
dots/.local/share/konsole                      -> ~/.local/share/konsole

[quickshell]
dots/.config/quickshell                        -> ~/.config/quickshell

[fish]
dots/.config/fish                              -> ~/.config/fish              !conf.d
dots/.config/fish/conf.d                       -> ~/.config/fish/conf.d !custom.fish

[fontconfig]
dots/.config/fontconfig                        -> ~/.config/fontconfig

[hyprland]
dots/.config/hypr/hyprland                     -> ~/.config/hypr/hyprland !local
dots/.config/hypr/custom                       -> ~/.config/hypr/custom
dots/.config/hypr/hyprlock.conf                -> ~/.config/hypr/hyprlock.conf
dots/.config/hypr/hyprland.lua                 -> ~/.config/hypr/hyprland.lua
dots/.config/hypr/hypridle.conf                -> ~/.config/hypr/hypridle.conf

[icons]
dots/.local/share/icons/illogical-impulse.svg  -> ~/.local/share/icons/illogical-impulse.svg

[nvim]
dots/.config/nvim                              -> ~/.config/nvim !.git
